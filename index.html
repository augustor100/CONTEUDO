<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4d2f2b" />
  <meta name="description" content="Conteúdo OS — organização profissional e criação de roteiros UGC." />
  <title>Conteúdo OS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script defer src="assets/ugc-library.js"></script>
  <script defer src="assets/ugc-engine.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">CO</div>
        <div>
          <strong>Conteúdo OS</strong>
          <span>Performance criativa</span>
        </div>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-route="today"><span>◫</span> Hoje</button>
        <button class="nav-item" data-route="create"><span>✦</span> Criar</button>
        <button class="nav-item" data-route="projects"><span>▦</span> Projetos</button>
        <button class="nav-item" data-route="calendar"><span>◷</span> Calendário</button>
        <button class="nav-item" data-route="insights"><span>⌁</span> Insights</button>
      </nav>

      <div class="sidebar-footer">
        <button class="quiet-button" id="exportDataBtn">Exportar dados</button>
        <button class="quiet-button" id="importDataBtn">Importar dados</button>
        <input id="importDataInput" type="file" accept="application/json" hidden />
        <button class="quiet-button danger-text" id="resetDataBtn">Restaurar demonstração</button>
        <p>Dados salvos neste navegador.</p>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenuBtn" aria-label="Abrir menu">☰</button>
        <div>
          <p class="eyebrow" id="pageEyebrow">PAINEL DO DIA</p>
          <h1 id="pageTitle">Hoje</h1>
        </div>
        <div class="top-actions">
          <span class="mode-badge" id="modeBadge">Modo demonstração</span>
          <button class="icon-button" id="settingsBtn" aria-label="Configurações">⚙</button>
        </div>
      </header>

      <section id="pageContent" class="page-content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <template id="todayTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">FOCO REALISTA</p>
        <h2>Seu dia, sem excesso de decisões.</h2>
        <p>Uma tarefa principal, até duas importantes e espaço para imprevistos.</p>
      </div>
      <button class="primary-button" id="newTaskBtn">+ Nova tarefa</button>
    </div>

    <div class="stats-grid" id="todayStats"></div>

    <div class="content-grid two-thirds">
      <section class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">PLANO DIÁRIO</p>
            <h3>Prioridades sugeridas</h3>
          </div>
          <span class="soft-badge" id="capacityBadge"></span>
        </div>
        <div id="dailyPlan"></div>
      </section>

      <aside class="card warm-card">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">PRÓXIMOS PASSOS</p>
            <h3>Prazos mais próximos</h3>
          </div>
        </div>
        <div id="upcomingDeadlines"></div>
      </aside>
    </div>

    <section class="card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CAIXA DE ENTRADA</p>
          <h3>Todas as tarefas abertas</h3>
        </div>
        <select id="taskAreaFilter" class="compact-select" aria-label="Filtrar área"></select>
      </div>
      <div id="taskList"></div>
    </section>
  </template>

  <template id="createTemplate">
    <div class="hero-panel create-hero practical-hero">
      <div>
        <p class="eyebrow">ESTÚDIO UGC PRÁTICO</p>
        <h2>Responda o essencial. Receba um roteiro pronto para gravar.</h2>
        <p>A lógica estratégica fica nos bastidores. Na tela, você vê apenas o que falar, o que fazer e como gravar.</p>
      </div>
      <div class="hero-actions">
        <button class="secondary-button" id="loadBriefingExampleBtn">Testar exemplo</button>
        <button class="primary-button" id="generateScriptTopBtn">Criar roteiro</button>
      </div>
    </div>

    <div class="create-layout practical-create-layout">
      <form id="briefingForm" class="card briefing-form compact-briefing">
        <div class="section-heading">
          <div>
            <p class="eyebrow">BRIEFING ESSENCIAL</p>
            <h3>Conte o que a IA realmente precisa saber</h3>
          </div>
          <span class="soft-badge">aprox. 2 minutos</span>
        </div>

        <div class="form-section no-border">
          <div class="form-grid">
            <label>Marca *<input name="brand" autocomplete="organization" required placeholder="Ex.: Monza" /></label>
            <label>Produto ou serviço *<input name="product" required placeholder="Ex.: caldo de mandioquinha" /></label>
            <label>Objetivo *
              <select name="objective" required>
                <option value="">Selecione</option>
                <option>Gerar vendas</option>
                <option>Gerar cliques</option>
                <option>Apresentar o produto</option>
                <option>Gerar identificação</option>
                <option>Ensinar como usar</option>
                <option>Gerar engajamento</option>
              </select>
            </label>
            <label>Onde será usado?
              <select name="distribution">
                <option>Orgânico</option>
                <option>Mídia paga</option>
                <option>Orgânico e mídia paga</option>
              </select>
            </label>
            <label>Duração
              <select name="durationSeconds">
                <option value="20">20 segundos</option>
                <option value="30">30 segundos</option>
                <option value="45" selected>45 segundos</option>
                <option value="60">60 segundos</option>
              </select>
            </label>
            <label>Formato
              <select name="format">
                <option>Deixar o aplicativo escolher</option>
                <option>Conversa com amiga</option>
                <option>Problema e solução</option>
                <option>Review</option>
                <option>Demonstração</option>
                <option>Rotina</option>
                <option>Unboxing</option>
                <option>Lista</option>
                <option>Resposta a comentário</option>
                <option>Sensorial / ASMR</option>
                <option>Tutorial</option>
                <option>Vlog</option>
              </select>
            </label>

            <label class="span-2">Quem precisa assistir? *<textarea name="targetAudience" rows="2" required placeholder="Ex.: pessoas que amam caldos, chegam cansadas em casa e querem um jantar prático."></textarea></label>
            <label class="span-2">Qual problema, desejo ou situação o vídeo deve abordar? *<textarea name="mainPain" rows="3" required placeholder="Ex.: chegar cansada e não querer cozinhar, mas também não querer pedir qualquer coisa."></textarea></label>
            <label class="span-2">O que torna o produto interessante? *<textarea name="differentiator" rows="3" required placeholder="Ex.: sabor caseiro, textura cremosa, porção bem servida e entrega rápida."></textarea></label>
            <label class="span-2">Briefing recebido da marca<textarea name="receivedBriefing" rows="4" placeholder="Cole aqui o briefing, mensagens obrigatórias, cupom, oferta, restrições ou pedido da marca."></textarea></label>
          </div>
        </div>

        <details class="optional-panel">
          <summary>Adicionar referências da marca <span>opcional</span></summary>
          <div class="form-grid optional-panel-content">
            <label class="span-2">Instagram, site ou página do produto<textarea name="brandLinks" rows="2" placeholder="Um link por linha."></textarea></label>
            <label class="span-2">Como a marca se comunica?<textarea name="brandVisualNotes" rows="3" placeholder="Ex.: acolhedora, divertida, premium, minimalista, técnica."></textarea></label>
            <label class="span-2">Prints da página ou identidade visual
              <input name="brandAssetFiles" type="file" accept="image/*" multiple />
              <small>Até 4 imagens.</small>
            </label>
            <div id="brandAssetPreview" class="brand-asset-preview span-2"></div>
          </div>
        </details>

        <details class="optional-panel">
          <summary>Preferências rápidas <span>opcional</span></summary>
          <div class="form-grid optional-panel-content">
            <label>Tipo de gancho
              <select name="hookPreference">
                <option>Escolher automaticamente</option>
                <option>Textual</option>
                <option>Visual</option>
                <option>Auditivo</option>
              </select>
            </label>
            <label>B-roll
              <select name="includeBRoll">
                <option>Automático</option>
                <option>Usar quando ajudar</option>
                <option>Não usar</option>
              </select>
            </label>
            <label>CTA
              <select name="ctaType">
                <option>Escolher automaticamente</option>
                <option>Comprar</option>
                <option>Clicar no link</option>
                <option>Comentar para receber o link</option>
                <option>Salvar e compartilhar</option>
              </select>
            </label>
            <label>Oferta verdadeira<input name="offerDetails" placeholder="Cupom, frete grátis ou condição real." /></label>
          </div>
        </details>

        <div class="form-actions practical-actions">
          <button type="button" class="quiet-button" id="saveBriefingBtn">Salvar rascunho</button>
          <button type="submit" class="primary-button">Gerar roteiro pronto</button>
        </div>
      </form>

      <aside class="card script-preview practical-preview" id="scriptPreview">
        <div class="empty-state large">
          <div class="empty-icon">✦</div>
          <h3>O roteiro pronto aparecerá aqui</h3>
          <p>Você receberá três ganchos e cenas com instruções objetivas de gravação.</p>
        </div>
      </aside>
    </div>

    <section class="card history-card">
      <div class="section-heading"><div><p class="eyebrow">HISTÓRICO</p><h3>Roteiros salvos</h3></div></div>
      <div id="scriptHistory"></div>
    </section>
  </template>

  <template id="projectsTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">ÁREAS E RESPONSABILIDADES</p>
        <h2>Projetos ativos em um único lugar.</h2>
        <p>Visualize o que está em andamento, bloqueado, aguardando ou concluído.</p>
      </div>
      <button class="primary-button" id="newProjectBtn">+ Novo projeto</button>
    </div>
    <div class="filter-row" id="projectFilters"></div>
    <div class="project-board" id="projectBoard"></div>
  </template>

  <template id="calendarTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">CALENDÁRIO EDITORIAL</p>
        <h2>Prazos e produção no mesmo horizonte.</h2>
        <p>Use esta visão para evitar conflitos e distribuir sua capacidade.</p>
      </div>
      <button class="primary-button" id="calendarNewTaskBtn">+ Agendar tarefa</button>
    </div>
    <section class="card calendar-card">
      <div class="calendar-toolbar">
        <button class="icon-button" id="prevMonthBtn">‹</button>
        <h3 id="calendarMonthTitle"></h3>
        <button class="icon-button" id="nextMonthBtn">›</button>
      </div>
      <div class="calendar-grid weekdays">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>
  </template>

  <template id="insightsTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">APRENDIZADO COM RESULTADOS</p>
        <h2>Descubra o que funciona para você.</h2>
        <p>Métricas pessoais são separadas de hipóteses gerais de mercado.</p>
      </div>
      <button class="primary-button" id="newMetricBtn">+ Registrar resultado</button>
    </div>
    <div class="stats-grid" id="insightStats"></div>
    <div class="content-grid two-thirds">
      <section class="card">
        <div class="section-heading">
          <div><p class="eyebrow">DESEMPENHO</p><h3>Conteúdos registrados</h3></div>
        </div>
        <div id="metricsTable"></div>
      </section>
      <aside class="card warm-card">
        <div class="section-heading compact">
          <div><p class="eyebrow">LEITURA ESTRATÉGICA</p><h3>Recomendações</h3></div>
        </div>
        <div id="insightRecommendations"></div>
      </aside>
    </div>
  </template>

  <template id="taskModalTemplate">
    <div class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header"><div><p class="eyebrow">NOVA AÇÃO</p><h3>Adicionar tarefa</h3></div><button class="icon-button modal-close">×</button></div>
        <form id="taskForm">
          <div class="form-grid">
            <label class="span-2">Ação clara *<input name="title" required placeholder="Ex.: Escrever três ganchos para o Reels" /></label>
            <label>Área<select name="area"></select></label>
            <label>Prazo<input name="dueDate" type="date" /></label>
            <label>Tempo estimado<input name="estimatedMinutes" type="number" min="5" max="480" value="30" /></label>
            <label>Energia<select name="energy"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></label>
            <label>Consequência<select name="consequence"><option value="1">Baixa</option><option value="2" selected>Média</option><option value="3">Alta</option><option value="4">Muito alta</option><option value="5">Crítica</option></select></label>
            <label>Impacto estratégico<select name="strategicImpact"><option value="1">Baixo</option><option value="2" selected>Médio</option><option value="3">Alto</option><option value="4">Muito alto</option><option value="5">Crítico</option></select></label>
            <label>Impacto em receita<select name="revenueImpact"><option value="0">Nenhum</option><option value="1">Baixo</option><option value="2">Médio</option><option value="3">Alto</option><option value="4">Muito alto</option><option value="5">Crítico</option></select></label>
            <label class="checkbox-label span-2"><input name="blocksOthers" type="checkbox" /> Esta tarefa bloqueia outras etapas</label>
            <label class="span-2">Observações<textarea name="notes" rows="3"></textarea></label>
          </div>
          <div class="form-actions"><button type="button" class="secondary-button modal-close">Cancelar</button><button class="primary-button" type="submit">Salvar tarefa</button></div>
        </form>
      </div>
    </div>
  </template>

  <template id="projectModalTemplate">
    <div class="modal-backdrop"><div class="modal-card"><div class="modal-header"><div><p class="eyebrow">NOVO PROJETO</p><h3>Criar projeto</h3></div><button class="icon-button modal-close">×</button></div>
      <form id="projectForm"><div class="form-grid">
        <label class="span-2">Nome do projeto *<input name="name" required /></label>
        <label>Área<select name="area"></select></label>
        <label>Status<select name="status"><option>Ideia</option><option>Planejado</option><option selected>Em andamento</option><option>Aguardando terceiro</option><option>Pausado</option><option>Concluído</option></select></label>
        <label>Prioridade<select name="priority"><option value="1">1 — Prazo imediato</option><option value="2" selected>2 — Crescimento</option><option value="3">3 — Melhoria</option></select></label>
        <label>Prazo<input name="dueDate" type="date" /></label>
      </div><div class="form-actions"><button type="button" class="secondary-button modal-close">Cancelar</button><button class="primary-button" type="submit">Criar projeto</button></div></form>
    </div></div>
  </template>

  <template id="metricModalTemplate">
    <div class="modal-backdrop"><div class="modal-card"><div class="modal-header"><div><p class="eyebrow">RESULTADO REAL</p><h3>Registrar métricas</h3></div><button class="icon-button modal-close">×</button></div>
      <form id="metricForm"><div class="form-grid">
        <label class="span-2">Título do conteúdo *<input name="contentTitle" required /></label>
        <label>Plataforma<select name="platform"><option>Instagram Reels</option><option>TikTok</option><option>Meta Ads</option><option>YouTube Shorts</option></select></label>
        <label>Data de publicação<input name="publishedAt" type="date" /></label>
        <label>Visualizações<input name="views" type="number" min="0" value="0" /></label>
        <label>Retenção (%)<input name="retentionPercent" type="number" min="0" max="100" step="0.1" value="0" /></label>
        <label>Cliques<input name="clicks" type="number" min="0" value="0" /></label>
        <label>Conversões<input name="conversions" type="number" min="0" value="0" /></label>
        <label class="span-2">Gancho utilizado<input name="hook" placeholder="Cole ou resuma o gancho" /></label>
      </div><div class="form-actions"><button type="button" class="secondary-button modal-close">Cancelar</button><button class="primary-button" type="submit">Salvar resultado</button></div></form>
    </div></div>
  </template>

  <template id="settingsModalTemplate">
    <div class="modal-backdrop"><div class="modal-card"><div class="modal-header"><div><p class="eyebrow">CONFIGURAÇÕES</p><h3>Modo de geração</h3></div><button class="icon-button modal-close">×</button></div>
      <form id="settingsForm"><div class="settings-choice">
        <label class="radio-card"><input type="radio" name="generationMode" value="demo" /><div><strong>Demonstração local</strong><span>Funciona agora, sem servidor e sem chave.</span></div></label>
        <label class="radio-card"><input type="radio" name="generationMode" value="backend" /><div><strong>IA pelo backend</strong><span>Usa o servidor seguro do projeto.</span></div></label>
      </div>
      <label>Endereço do backend<input name="backendUrl" placeholder="http://127.0.0.1:8787" /></label>
      <p class="helper-text">Nunca coloque uma chave da OpenAI diretamente nesta tela.</p>
      <div class="form-actions"><button type="button" class="secondary-button modal-close">Cancelar</button><button class="primary-button" type="submit">Salvar configurações</button></div></form>
    </div></div>
  </template>
</body>
</html>
