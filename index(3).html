<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4d2f2b" />
  <meta name="description" content="Conteúdo OS — organização profissional e criação de roteiros UGC." />
  <title>Conteúdo OS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
:root {
  --bg: #f7f2ee;
  --surface: #fffdfb;
  --surface-2: #f2e6e2;
  --ink: #2b2220;
  --muted: #766965;
  --line: #e8ddd8;
  --brown: #4d2f2b;
  --brown-2: #6a413b;
  --pink: #d65986;
  --pink-soft: #f8dce6;
  --cream: #fff4e9;
  --green: #5d7c65;
  --amber: #a36a2b;
  --red: #aa4b4b;
  --shadow: 0 18px 50px rgba(77, 47, 43, .08);
  --radius: 22px;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at top right, #f8e8ee 0, transparent 32%), var(--bg); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 28px 22px; background: rgba(255,253,251,.92); border-right: 1px solid var(--line); backdrop-filter: blur(18px); display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 28px; }
.brand-mark { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(145deg, var(--brown), var(--pink)); color: white; font-weight: 800; letter-spacing: -.03em; box-shadow: 0 10px 25px rgba(77,47,43,.18); }
.brand strong, .brand span { display: block; }
.brand strong { font-size: 1rem; }
.brand span { margin-top: 3px; color: var(--muted); font-size: .78rem; }
.side-nav { display: grid; gap: 8px; }
.nav-item { width: 100%; border: 0; border-radius: 14px; padding: 13px 14px; text-align: left; background: transparent; color: var(--muted); display: flex; align-items: center; gap: 12px; font-weight: 650; transition: .18s ease; }
.nav-item span { width: 24px; text-align: center; font-size: 1.15rem; }
.nav-item:hover { background: #f5ece8; color: var(--brown); }
.nav-item.active { background: var(--brown); color: white; box-shadow: 0 10px 25px rgba(77,47,43,.18); }
.sidebar-footer { margin-top: auto; display: grid; gap: 5px; }
.sidebar-footer p { color: var(--muted); font-size: .72rem; padding: 7px 8px 0; margin: 0; }
.quiet-button { border: 0; background: transparent; color: var(--brown); padding: 9px 8px; text-align: left; font-weight: 650; border-radius: 10px; }
.quiet-button:hover { background: #f5ece8; }
.danger-text { color: var(--red); }
.main-area { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 15; min-height: 92px; padding: 20px 36px; border-bottom: 1px solid rgba(232,221,216,.75); background: rgba(247,242,238,.88); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { margin: 2px 0 0; font-size: clamp(1.65rem, 3vw, 2.1rem); letter-spacing: -.04em; }
.eyebrow { margin: 0; color: var(--pink); font-size: .7rem; letter-spacing: .12em; font-weight: 800; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.mode-badge, .soft-badge { display: inline-flex; align-items: center; min-height: 28px; padding: 5px 10px; border-radius: 999px; background: var(--pink-soft); color: #8d3255; font-size: .75rem; font-weight: 750; }
.icon-button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--brown); display: grid; place-items: center; font-size: 1.1rem; }
.mobile-menu { display: none; }
.page-content { padding: 30px 36px 60px; display: grid; gap: 22px; max-width: 1580px; margin: 0 auto; }
.hero-panel { border-radius: 28px; padding: 28px 30px; background: linear-gradient(135deg, var(--brown) 0%, #684039 68%, #89505d 100%); color: white; display: flex; justify-content: space-between; align-items: center; gap: 24px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.hero-panel::after { content: ""; position: absolute; width: 220px; height: 220px; right: -80px; top: -100px; border-radius: 50%; background: rgba(255,255,255,.08); pointer-events: none; }
.hero-panel > * { position: relative; z-index: 1; }
.hero-panel h2 { margin: 6px 0 8px; font-size: clamp(1.5rem, 3vw, 2.25rem); letter-spacing: -.04em; max-width: 760px; }
.hero-panel p:not(.eyebrow) { margin: 0; color: rgba(255,255,255,.78); max-width: 760px; }
.hero-panel .eyebrow { color: #ffc3d8; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; z-index: 2; }
.primary-button, .secondary-button { border-radius: 13px; padding: 12px 17px; font-weight: 800; border: 1px solid transparent; transition: .18s ease; white-space: nowrap; }
.primary-button { background: var(--pink); color: white; box-shadow: 0 8px 22px rgba(214,89,134,.26); }
.primary-button:hover { transform: translateY(-1px); background: #c94c79; }
.secondary-button { background: var(--surface); color: var(--brown); border-color: var(--line); }
.hero-panel .secondary-button { background: rgba(255,255,255,.12); color: white; border-color: rgba(255,255,255,.25); backdrop-filter: blur(10px); }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 15px; }
.stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 19px; box-shadow: 0 10px 30px rgba(77,47,43,.04); }
.stat-card span { color: var(--muted); font-size: .78rem; }
.stat-card strong { display: block; margin-top: 7px; font-size: 1.65rem; letter-spacing: -.04em; }
.stat-card small { color: var(--muted); }
.content-grid { display: grid; gap: 18px; }
.content-grid.two-thirds { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.card { background: rgba(255,253,251,.96); border: 1px solid var(--line); border-radius: var(--radius); padding: 23px; box-shadow: var(--shadow); min-width: 0; }
.warm-card { background: linear-gradient(180deg, #fffaf6, #fbefe9); }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
.section-heading.compact { align-items: flex-start; }
.section-heading h3 { margin: 5px 0 0; font-size: 1.18rem; letter-spacing: -.02em; }
.empty-state { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
.empty-state.large { min-height: 360px; display: grid; align-content: center; justify-items: center; }
.empty-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; background: var(--pink-soft); color: var(--pink); font-size: 1.7rem; margin-bottom: 12px; }
.plan-block { border: 1px solid var(--line); border-radius: 17px; padding: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 13px; align-items: start; margin-top: 11px; background: #fff; }
.plan-block.main { border-color: #e9b5c8; background: linear-gradient(120deg, #fff 0, #fff5f8 100%); }
.plan-rank { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--brown); font-weight: 900; }
.plan-block.main .plan-rank { background: var(--pink); color: white; }
.plan-content strong { display: block; margin-bottom: 5px; }
.meta-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .75rem; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; background: #f5ece8; color: var(--brown); font-size: .72rem; font-weight: 700; }
.score-chip { background: #fff2d8; color: #86570f; }
.complete-button { border: 0; background: #edf4ee; color: var(--green); border-radius: 10px; padding: 8px 10px; font-weight: 800; }
.task-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 3px; border-bottom: 1px solid var(--line); }
.task-row:last-child { border-bottom: 0; }
.task-check { width: 22px; height: 22px; accent-color: var(--pink); }
.task-row.completed .task-title { text-decoration: line-through; color: var(--muted); }
.task-title { font-weight: 720; margin-bottom: 4px; }
.task-actions { display: flex; gap: 6px; }
.mini-button { border: 1px solid var(--line); background: var(--surface); color: var(--brown); border-radius: 9px; padding: 6px 8px; }
.deadline-item { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(232,221,216,.8); }
.deadline-item:last-child { border: 0; }
.deadline-item strong { display: block; font-size: .9rem; }
.deadline-item span { color: var(--muted); font-size: .75rem; }
.deadline-date { font-weight: 800; color: var(--pink) !important; text-align: right; }
.compact-select { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px 10px; }
.create-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr); gap: 18px; align-items: start; }
.briefing-form { min-width: 0; }
.form-section { padding: 18px 0; border-top: 1px solid var(--line); }
.form-section:first-of-type { border-top: 0; padding-top: 0; }
.form-section h4 { margin: 0 0 13px; color: var(--brown); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
label { display: grid; gap: 7px; color: var(--brown); font-size: .78rem; font-weight: 760; }
label.span-2 { grid-column: span 2; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 11px; padding: 11px 12px; outline: none; transition: .16s ease; }
input:focus, select:focus, textarea:focus { border-color: #d686a4; box-shadow: 0 0 0 3px rgba(214,89,134,.12); }
textarea { resize: vertical; }
.checkbox-label { display: flex; align-items: center; grid-template-columns: auto 1fr; }
.checkbox-label input { width: auto; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-top: 18px; }
.script-preview { position: sticky; top: 116px; max-height: calc(100vh - 140px); overflow: auto; }
.script-header { padding-bottom: 15px; border-bottom: 1px solid var(--line); }
.script-header h3 { margin: 6px 0; font-size: 1.45rem; }
.script-section { padding: 16px 0; border-bottom: 1px solid var(--line); }
.script-section:last-child { border-bottom: 0; }
.script-section h4 { margin: 0 0 10px; color: var(--brown); }
.hook-option { width: 100%; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 12px; text-align: left; margin-bottom: 8px; color: var(--ink); }
.hook-option.selected { border-color: var(--pink); background: #fff5f8; box-shadow: 0 0 0 2px rgba(214,89,134,.1); }
.scene-card { border: 1px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 10px; background: #fff; }
.scene-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.scene-head strong { color: var(--brown); }
.scene-head span { color: var(--pink); font-weight: 800; font-size: .75rem; }
.scene-card p { margin: 6px 0; font-size: .87rem; line-height: 1.5; }
.scene-detail { color: var(--muted); }
.copy-row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin-top: 8px; background: #fff; }
.copy-row p { margin: 0; font-size: .86rem; line-height: 1.5; }
.history-item { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.history-item:last-child { border: 0; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 8px 12px; font-weight: 720; }
.filter-button.active { background: var(--brown); color: white; border-color: var(--brown); }
.project-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.project-column { border: 1px solid var(--line); border-radius: 20px; background: rgba(255,253,251,.72); padding: 14px; min-height: 260px; }
.project-column-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 12px; }
.project-column-head h3 { margin: 0; font-size: 1rem; }
.project-count { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--brown); font-weight: 800; }
.project-card { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 14px; margin-bottom: 10px; box-shadow: 0 8px 22px rgba(77,47,43,.05); }
.project-card h4 { margin: 8px 0 7px; }
.project-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 13px; }
.priority-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.priority-1 { background: var(--red); }.priority-2 { background: var(--amber); }.priority-3 { background: var(--green); }
.calendar-toolbar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 18px; }
.calendar-toolbar h3 { min-width: 190px; text-align: center; text-transform: capitalize; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
.calendar-grid.weekdays { color: var(--muted); font-size: .74rem; font-weight: 800; text-align: center; margin-bottom: 8px; }
.calendar-day { min-height: 118px; border: 1px solid var(--line); border-radius: 14px; padding: 9px; background: #fff; overflow: hidden; }
.calendar-day.outside { opacity: .42; }
.calendar-day.today { border-color: var(--pink); box-shadow: inset 0 0 0 1px var(--pink); }
.day-number { font-weight: 800; color: var(--brown); }
.calendar-event { display: block; margin-top: 6px; border-radius: 7px; padding: 4px 6px; background: #f5ece8; color: var(--brown); font-size: .66rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calendar-event.high { background: #fde8e8; color: #8e3838; }
.metrics-table { width: 100%; border-collapse: collapse; }
.metrics-table th, .metrics-table td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: .78rem; }
.metrics-table th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
.recommendation { border: 1px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 10px; background: rgba(255,255,255,.66); }
.recommendation strong { display: block; margin-bottom: 5px; }
.recommendation p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.45; }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(43,34,32,.5); backdrop-filter: blur(8px); }
.modal-card { width: min(700px, 100%); max-height: 92vh; overflow: auto; border-radius: 24px; background: var(--surface); border: 1px solid rgba(255,255,255,.65); padding: 22px; box-shadow: 0 30px 90px rgba(43,34,32,.25); }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.modal-header h3 { margin: 5px 0 0; font-size: 1.35rem; }
.toast { position: fixed; z-index: 200; left: 50%; bottom: 25px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--brown); color: white; border-radius: 12px; padding: 11px 16px; font-weight: 720; box-shadow: 0 16px 45px rgba(43,34,32,.25); transition: .25s ease; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.settings-choice { display: grid; gap: 10px; margin-bottom: 15px; }
.radio-card { grid-template-columns: auto 1fr; display: grid; align-items: start; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.radio-card input { width: auto; margin-top: 3px; }
.radio-card strong, .radio-card span { display: block; }
.radio-card span { color: var(--muted); margin-top: 4px; font-weight: 500; }
.helper-text { color: var(--muted); font-size: .76rem; }
.loading-state { display: grid; min-height: 340px; align-content: center; justify-items: center; text-align: center; color: var(--muted); }
.spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--pink-soft); border-top-color: var(--pink); animation: spin .8s linear infinite; margin-bottom: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 1180px) {
  .create-layout { grid-template-columns: 1fr; }
  .script-preview { position: static; max-height: none; }
  .project-board { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -280px; width: 260px; box-shadow: 20px 0 50px rgba(43,34,32,.15); transition: .22s ease; }
  .sidebar.open { left: 0; }
  .mobile-menu { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); margin-right: 12px; }
  .topbar { justify-content: flex-start; padding: 17px 20px; }
  .top-actions { margin-left: auto; }
  .page-content { padding: 22px 20px 50px; }
  .content-grid.two-thirds { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 620px) {
  .mode-badge { display: none; }
  .hero-panel { align-items: flex-start; flex-direction: column; padding: 23px; }
  .hero-actions { width: 100%; }
  .hero-actions button, .hero-panel > .primary-button { width: 100%; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 15px; }
  .form-grid { grid-template-columns: 1fr; }
  label.span-2 { grid-column: span 1; }
  .form-actions { flex-direction: column-reverse; }
  .form-actions button { width: 100%; text-align: center; }
  .project-board { grid-template-columns: 1fr; }
  .calendar-card { padding: 12px; overflow-x: auto; }
  .calendar-grid { min-width: 680px; }
  .metrics-table { min-width: 660px; }
  #metricsTable { overflow-x: auto; }
  .topbar h1 { font-size: 1.45rem; }
  .page-content { padding-left: 13px; padding-right: 13px; }
  .card { padding: 17px; border-radius: 18px; }
  .task-row { grid-template-columns: auto 1fr; }
  .task-actions { grid-column: 2; }
}

/* Estúdio UGC 3.0 */
.section-help { margin: -4px 0 14px; color: var(--muted); font-size: .84rem; line-height: 1.55; }
.choice-field { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; display: flex; flex-wrap: wrap; gap: 10px 18px; }
.choice-field legend { padding: 0 6px; color: var(--brown); font-size: .78rem; font-weight: 800; }
.choice-field .checkbox-label { min-width: 145px; font-weight: 650; color: var(--ink); }
.reference-note { margin-top: 14px; border-left: 4px solid var(--pink); background: #fff6f8; border-radius: 12px; padding: 13px 14px; }
.reference-note strong { color: var(--brown); }
.reference-note p { margin: 5px 0 0; font-size: .84rem; color: var(--muted); line-height: 1.5; }
.analysis-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.analysis-bar span { color: var(--muted); font-size: .8rem; }
.analysis-result { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 13px; }
.analysis-result.success { border-color: #b8d7ca; background: #f2fbf6; }
.analysis-result p { margin: 6px 0; line-height: 1.5; font-size: .84rem; }
.analysis-result ul { margin: 8px 0 0; padding-left: 20px; }
.analysis-result li { margin: 6px 0; font-size: .84rem; line-height: 1.45; }
.brand-asset-preview { margin-top: 12px; }
.brand-thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.brand-thumb { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
.brand-thumb img { width: 100%; height: 110px; object-fit: cover; display: block; }
.brand-thumb figcaption { padding: 7px 8px; font-size: .68rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.color-swatch { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 8px; font-size: .68rem; color: var(--muted); }
.color-swatch i { width: 18px; height: 18px; border-radius: 50%; background: var(--swatch); border: 1px solid rgba(0,0,0,.12); }
.hook-option { cursor: pointer; }
.hook-main { margin: 10px 0 8px !important; font-size: .92rem !important; line-height: 1.5 !important; color: var(--ink); }
.hook-score { margin-left: auto; font-weight: 850; font-size: .72rem; color: var(--pink); }
.idea-card { border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 12px; margin-bottom: 9px; }
.idea-card strong { color: var(--brown); }
.idea-card p { margin: 7px 0 0; font-size: .84rem; line-height: 1.48; }
.duration-box { border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: #fff; }
.duration-box.success { border-color: #b8d7ca; background: #f2fbf6; }
.duration-box.warning { border-color: #ead0a4; background: #fff9ef; }
.duration-box p { margin: 6px 0 0; font-size: .82rem; line-height: 1.45; }
.quality-grid { display: grid; gap: 7px; margin-bottom: 12px; }
.quality-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; font-size: .8rem; }
.quality-item.passed { background: #f2fbf6; color: #315f4a; }
.quality-item.failed { background: #fff4f2; color: #8f3f34; }
.quality-item span { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.75); font-weight: 900; }

@media (max-width: 760px) {
  .choice-field { display: grid; grid-template-columns: 1fr 1fr; }

/* Estúdio UGC prático 4.0 */
.practical-hero h2 { max-width: 720px; }
.practical-create-layout { grid-template-columns: minmax(420px, .82fr) minmax(520px, 1.18fr); }
.compact-briefing .section-heading { margin-bottom: 8px; }
.compact-briefing .form-section.no-border { padding-top: 8px; border-top: 0; }
.optional-panel { border: 1px solid var(--line); border-radius: 15px; background: #fff; margin-top: 13px; overflow: hidden; }
.optional-panel summary { cursor: pointer; list-style: none; padding: 14px 15px; color: var(--brown); font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
.optional-panel summary::-webkit-details-marker { display: none; }
.optional-panel summary::after { content: "+"; width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); }
.optional-panel[open] summary::after { content: "−"; }
.optional-panel summary span { margin-left: auto; margin-right: 10px; color: var(--muted); font-size: .7rem; font-weight: 650; }
.optional-panel-content { padding: 15px; border-top: 1px solid var(--line); }
.practical-actions { padding-top: 4px; }
.practical-preview { max-height: calc(100vh - 120px); padding: 20px; }
.practical-script-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.practical-script-header h3 { margin-bottom: 8px; }
.practical-section { padding: 20px 0; border-bottom: 1px solid var(--line); }
.practical-section:last-of-type { border-bottom: 0; }
.practical-section-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.practical-section-title > div { display: flex; gap: 11px; align-items: flex-start; }
.practical-section-title h4 { margin: 1px 0 3px; color: var(--brown); font-size: 1.02rem; }
.practical-section-title p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
.step-number { flex: 0 0 30px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: var(--brown); color: white; font-weight: 900; }
.selected-confirmation { border-radius: 999px; background: #edf7ef; color: var(--green); padding: 6px 9px; font-size: .7rem; font-weight: 850; white-space: nowrap; }
.hook-choice-grid { display: grid; gap: 9px; }
.hook-choice { width: 100%; border: 1px solid var(--line); border-radius: 15px; padding: 13px; background: #fff; color: var(--ink); text-align: left; transition: .16s ease; }
.hook-choice:hover { border-color: #d9a1b6; transform: translateY(-1px); }
.hook-choice.selected { border: 2px solid var(--pink); padding: 12px; background: #fff5f8; box-shadow: 0 0 0 3px rgba(214,89,134,.08); }
.hook-choice-top { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.hook-letter { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--brown); color: white; font-weight: 900; }
.hook-choice.selected .hook-letter { background: var(--pink); }
.selected-label { margin-left: auto; color: var(--pink); font-size: .65rem; font-weight: 900; letter-spacing: .08em; }
.hook-choice strong { display: block; line-height: 1.45; font-size: .91rem; }
.hook-choice small { display: block; color: var(--muted); margin-top: 7px; line-height: 1.4; }
.practical-scenes { display: grid; gap: 12px; }
.practical-scene-card { border: 1px solid var(--line); border-radius: 17px; padding: 15px; background: #fff; box-shadow: 0 8px 24px rgba(77,47,43,.04); }
.practical-scene-card.active-hook-scene { border-color: #e5a3bb; background: linear-gradient(135deg,#fff 0,#fff7fa 100%); }
.practical-scene-card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.practical-scene-card header span { color: var(--pink); font-size: .68rem; font-weight: 900; letter-spacing: .08em; }
.practical-scene-card header h5 { margin: 2px 0 0; color: var(--brown); font-size: 1rem; }
.practical-scene-card header > strong { font-size: .72rem; color: var(--muted); }
.scene-practical-block { margin-top: 13px; }
.scene-practical-block > span, .scene-practical-row > span, .delivery-card > span { display: block; color: var(--pink); font-size: .66rem; font-weight: 900; letter-spacing: .09em; margin-bottom: 5px; }
.speak-block p { margin: 0; font-size: 1.02rem; line-height: 1.5; font-weight: 690; color: var(--brown); }
.record-steps { margin: 6px 0 0; padding-left: 23px; }
.record-steps li { margin: 7px 0; padding-left: 3px; color: var(--ink); font-size: .85rem; line-height: 1.48; }
.scene-practical-row { margin-top: 12px; border-radius: 11px; background: #f8f3f0; padding: 10px 11px; }
.scene-practical-row strong, .scene-practical-row p { margin: 0; font-size: .82rem; line-height: 1.45; }
.subtle-row { background: #fbf8f6; color: var(--muted); }
.practical-delivery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.delivery-card { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 13px; }
.delivery-card .copy-row { border: 0; padding: 0; margin: 0; }
.delivery-card strong { display: block; color: var(--brown); margin-bottom: 6px; }
.delivery-card p { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }
.internal-details { margin-top: 16px; border: 1px dashed var(--line); border-radius: 13px; background: #fbf8f6; }
.internal-details summary { cursor: pointer; padding: 12px 13px; color: var(--muted); font-size: .75rem; font-weight: 750; }
.internal-details-content { padding: 0 13px 13px; color: var(--muted); font-size: .78rem; line-height: 1.45; }
.internal-details-content p { margin: 7px 0; }
.practical-result-actions { position: sticky; bottom: -20px; margin: 14px -20px -20px; padding: 14px 20px; background: rgba(255,253,251,.96); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }

@media (max-width: 1280px) {
  .practical-create-layout { grid-template-columns: 1fr; }
  .practical-preview { position: static; max-height: none; }
}
@media (max-width: 620px) {
  .practical-delivery-grid { grid-template-columns: 1fr; }
  .practical-section-title { flex-direction: column; }
  .selected-confirmation { align-self: flex-start; }
  .practical-script-header { flex-direction: column; }
}

/* Roteiro pronto — versão final contínua */
.ready-script-modal { width: min(960px, 100%); padding: 0; overflow: hidden; }
.ready-modal-header { padding: 22px 24px 18px; margin: 0; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #fffdfb 0%, #fff3f7 100%); }
.ready-modal-header h3 { margin: 4px 0 10px; max-width: 760px; }
.ready-script-section { padding: 22px 24px; border-bottom: 1px solid var(--line); }

.ready-section-heading > div { display: flex; gap: 12px; align-items: flex-start; }
.ready-section-heading h4 { margin: 0 0 3px; color: var(--brown); font-size: 1.05rem; }
.ready-section-heading p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.45; }
.ready-continuous-box { padding: 20px; border-radius: 18px; background: #fff6f9; border: 1px solid #efbfd0; color: var(--ink); font-size: 1.05rem; line-height: 1.72; box-shadow: inset 4px 0 0 var(--pink); }
.ready-scenes-grid { display: grid; gap: 12px; }
.ready-scene-card { padding: 16px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
.ready-scene-card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.ready-scene-card header span { color: var(--pink); font-size: .68rem; font-weight: 900; letter-spacing: .08em; }
.ready-scene-card header h5 { margin: 2px 0 0; color: var(--brown); font-size: 1rem; }
.ready-scene-card header > strong { color: var(--muted); font-size: .75rem; }
.ready-direction { margin: 0 0 10px; color: var(--muted); font-weight: 700; line-height: 1.5; }
.ready-quote { margin: 0 0 12px; padding: 13px 14px; border-left: 4px solid var(--pink); border-radius: 0 12px 12px 0; background: #fff7fa; color: var(--ink); line-height: 1.58; }
.ready-deliveries { display: grid; grid-template-columns: 1.35fr .65fr; gap: 14px; background: #fbf6f3; }
.ready-deliveries article { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.ready-deliveries article > span { display: block; margin-bottom: 8px; color: var(--pink); font-size: .7rem; font-weight: 900; letter-spacing: .08em; }
.ready-deliveries p { margin: 7px 0 0; line-height: 1.55; }
.ready-modal-actions { position: sticky; bottom: 0; margin: 0; padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); background: rgba(255,253,251,.97); border-top: 1px solid var(--line); backdrop-filter: blur(12px); }
@media (max-width: 700px) {
  .modal-backdrop { padding: 0; align-items: end; }
  .ready-script-modal { width: 100%; max-height: 96vh; border-radius: 24px 24px 0 0; }
  .ready-modal-header, .ready-script-section { padding-left: 16px; padding-right: 16px; }
  .ready-section-heading { flex-direction: column; }
  .ready-deliveries { grid-template-columns: 1fr; }
  .ready-continuous-box { font-size: 1rem; line-height: 1.64; }
  .ready-modal-actions { padding-left: 16px; padding-right: 16px; }
}

<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">

        <div class="brand-mark" aria-hidden="true">CO</div>

          <strong>Conteúdo OS</strong>
          <span>Performance criativa</span>
        </div>
      </div>

        <button class="quiet-button" id="importDataBtn">Importar dados</button>
        <input id="importDataInput" type="file" accept="application/json" hidden />
        <button class="quiet-button danger-text" id="resetDataBtn">Restaurar demonstração</button>
        <p>Dados salvos neste navegador.</p>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenuBtn" aria-label="Abrir menu">☰</button>
        <div>
          <p class="eyebrow" id="pageEyebrow">PAINEL DO DIA</p>
          <h1 id="pageTitle">Hoje</h1>
        </div>
        <div class="top-actions">
          <span class="mode-badge" id="modeBadge">Modo demonstração</span>

        </div>
      </header>

      <section id="pageContent" class="page-content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <template id="todayTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">FOCO REALISTA</p>
        <h2>Seu dia, sem excesso de decisões.</h2>
        <p>Uma tarefa principal, até duas importantes e espaço para imprevistos.</p>
      </div>
      <button class="primary-button" id="newTaskBtn">+ Nova tarefa</button>
    </div>

    <div class="stats-grid" id="todayStats"></div>

    <div class="content-grid two-thirds">
      <section class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">PLANO DIÁRIO</p>
            <h3>Prioridades sugeridas</h3>
          </div>
          <span class="soft-badge" id="capacityBadge"></span>
        </div>
        <div id="dailyPlan"></div>
      </section>

      <aside class="card warm-card">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">PRÓXIMOS PASSOS</p>
            <h3>Prazos mais próximos</h3>
          </div>
        </div>
        <div id="upcomingDeadlines"></div>
      </aside>
    </div>

    <section class="card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CAIXA DE ENTRADA</p>
          <h3>Todas as tarefas abertas</h3>
        </div>
        <select id="taskAreaFilter" class="compact-select" aria-label="Filtrar área"></select>
      </div>
      <div id="taskList"></div>
    </section>
  </template>

  <template id="createTemplate">
    <div class="hero-panel create-hero practical-hero">
      <div>
        <p class="eyebrow">ESTÚDIO UGC PRÁTICO</p>
        <h2>Responda o essencial. Receba um roteiro pronto para gravar.</h2>
        <p>A lógica estratégica fica nos bastidores. Na tela, você vê apenas o que falar, o que fazer e como gravar.</p>
      </div>
      <div class="hero-actions">
        <button class="secondary-button" id="loadBriefingExampleBtn">Testar exemplo</button>
        <button class="primary-button" id="generateScriptTopBtn">Criar roteiro</button>
      </div>
    </div>

    <div class="create-layout practical-create-layout">
      <form id="briefingForm" class="card briefing-form compact-briefing">
        <div class="section-heading">
          <div>
            <p class="eyebrow">BRIEFING ESSENCIAL</p>
            <h3>Conte o que a IA realmente precisa saber</h3>
          </div>
          <span class="soft-badge">aprox. 2 minutos</span>
        </div>

        <div class="form-section no-border">
          <div class="form-grid">
            <label>Marca *<input name="brand" autocomplete="organization" required placeholder="Ex.: Monza" /></label>
            <label>Produto ou serviço *<input name="product" required placeholder="Ex.: caldo de mandioquinha" /></label>
            <label>Objetivo *
              <select name="objective" required>
                <option value="">Selecione</option>
                <option>Gerar vendas</option>
                <option>Gerar cliques</option>
                <option>Apresentar o produto</option>
                <option>Gerar identificação</option>
                <option>Ensinar como usar</option>
                <option>Gerar engajamento</option>
              </select>
            </label>
            <label>Onde será usado?
              <select name="distribution">
                <option>Orgânico</option>
                <option>Mídia paga</option>
                <option>Orgânico e mídia paga</option>
              </select>
            </label>
            <label>Duração
              <select name="durationSeconds">
                <option value="20">20 segundos</option>
                <option value="30">30 segundos</option>
                <option value="45" selected>45 segundos</option>
                <option value="60">60 segundos</option>
              </select>
            </label>
            <label>Formato
              <select name="format">
                <option>Deixar o aplicativo escolher</option>
                <option>Conversa com amiga</option>
                <option>Problema e solução</option>
                <option>Review</option>
                <option>Demonstração</option>
                <option>Rotina</option>
                <option>Unboxing</option>
                <option>Lista</option>
                <option>Resposta a comentário</option>
                <option>Sensorial / ASMR</option>
                <option>Tutorial</option>
                <option>Vlog</option>
              </select>
            </label>

            <label class="span-2">Quem precisa assistir? *<textarea name="targetAudience" rows="2" required placeholder="Ex.: pessoas que amam caldos, chegam cansadas em casa e querem um jantar prático."></textarea></label>
            <label class="span-2">Qual problema, desejo ou situação o vídeo deve abordar? *<textarea name="mainPain" rows="3" required placeholder="Ex.: chegar cansada e não querer cozinhar, mas também não querer pedir qualquer coisa."></textarea></label>
            <label class="span-2">O que torna o produto interessante? *<textarea name="differentiator" rows="3" required placeholder="Ex.: sabor caseiro, textura cremosa, porção bem servida e entrega rápida."></textarea></label>
            <label class="span-2">Briefing recebido da marca<textarea name="receivedBriefing" rows="4" placeholder="Cole aqui o briefing, mensagens obrigatórias, cupom, oferta, restrições ou pedido da marca."></textarea></label>
          </div>
        </div>

        <details class="optional-panel">
          <summary>Adicionar referências da marca <span>opcional</span></summary>
          <div class="form-grid optional-panel-content">
            <label class="span-2">Instagram, site ou página do produto<textarea name="brandLinks" rows="2" placeholder="Um link por linha."></textarea></label>
            <label class="span-2">Como a marca se comunica?<textarea name="brandVisualNotes" rows="3" placeholder="Ex.: acolhedora, divertida, premium, minimalista, técnica."></textarea></label>
            <label class="span-2">Prints da página ou identidade visual
              <input name="brandAssetFiles" type="file" accept="image/*" multiple />
              <small>Até 4 imagens.</small>
            </label>
            <div id="brandAssetPreview" class="brand-asset-preview span-2"></div>
          </div>
        </details>

        <details class="optional-panel">
          <summary>Preferências rápidas <span>opcional</span></summary>
          <div class="form-grid optional-panel-content">
            <label>Tipo de gancho
              <select name="hookPreference">
                <option>Escolher automaticamente</option>
                <option>Textual</option>
                <option>Visual</option>
                <option>Auditivo</option>
              </select>
            </label>
            <label>B-roll
              <select name="includeBRoll">
                <option>Automático</option>
                <option>Usar quando ajudar</option>
                <option>Não usar</option>
              </select>
            </label>
            <label>CTA
              <select name="ctaType">
                <option>Escolher automaticamente</option>
                <option>Comprar</option>
                <option>Clicar no link</option>
                <option>Comentar para receber o link</option>
                <option>Salvar e compartilhar</option>
              </select>
            </label>
            <label>Oferta verdadeira<input name="offerDetails" placeholder="Cupom, frete grátis ou condição real." /></label>
          </div>
        </details>

        <div class="form-actions practical-actions">
          <button type="button" class="quiet-button" id="saveBriefingBtn">Salvar rascunho</button>
          <button type="submit" class="primary-button">Gerar roteiro pronto</button>
        </div>
      </form>

      <aside class="card script-preview practical-preview" id="scriptPreview">
        <div class="empty-state large">
          <div class="empty-icon">✦</div>
          <h3>O roteiro pronto aparecerá aqui</h3>
          <p>Você receberá três ganchos e cenas com instruções objetivas de gravação.</p>
        </div>
      </aside>
    </div>

    <section class="card history-card">
      <div class="section-heading"><div><p class="eyebrow">HISTÓRICO</p><h3>Roteiros salvos</h3></div></div>
      <div id="scriptHistory"></div>
    </section>
  </template>

  <template id="projectsTemplate">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">ÁREAS E RESPONSABILIDADES</p>

      </section>
      <aside class="card warm-card">

  <template id="taskModalTemplate">
    <div class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header"><div><p class="eyebrow">NOVA AÇÃO</p><h3>Adicionar tarefa</h3></div><button class="icon-button modal-close">×</button></div>
        <form id="taskForm">
          <div class="form-grid">
            <label class="span-2">Ação clara *<input name="title" required placeholder="Ex.: Escrever três ganchos para o Reels" /></label>
            <label>Área<select name="area"></select></label>
            <label>Prazo<input name="dueDate" type="date" /></label>
            <label>Tempo estimado<input name="estimatedMinutes" type="number" min="5" max="480" value="30" /></label>
            <label>Energia<select name="energy"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></label>

(function (root, factory) {
  const library = (typeof module === "object" && module.exports)
    ? require("./ugc-library.js")

  const api = factory(library || {});

})(typeof globalThis !== "undefined" ? globalThis : this, function (LIBRARY) {
  "use strict";

  const FIRST_PERSON = ["eu ", "meu ", "minha ", "me ", "comigo", "pra mim", "para mim", "quando eu", "na minha"];

  function clean(value, fallback = "") {
    return typeof value === "string" && value.trim() ? value.trim().replace(/\s+/g, " ") : fallback;
  }

  function lines(value) {
    if (Array.isArray(value)) return value.map(v => clean(v)).filter(Boolean);
    return clean(value).split(/\n|;|\|/).map(v => v.trim()).filter(Boolean);
  }

  function lowerFirst(value) {
    const text = clean(value);
    return text ? text.charAt(0).toLowerCase() + text.slice(1) : text;
  }

  function words(value, max = 12) {
    const all = clean(value).replace(/[.!?]+$/, "").split(/\s+/).filter(Boolean);
    return all.slice(0, max).join(" ");
  }

  function libraryFormats() {
    return Array.isArray(LIBRARY.formats) ? LIBRARY.formats : [];
  }

  function findLibraryFormat(fragment, fallback) {
    const found = libraryFormats().find(item => clean(item).toLowerCase().includes(fragment.toLowerCase()));
    return found || fallback;
  }

  function audioFamily(name) {
    return Array.isArray(LIBRARY.audioHooks?.[name]) ? LIBRARY.audioHooks[name] : [];
  }

  function hasAudioPattern(family, fragment) {
    return audioFamily(family).some(item => clean(item).toLowerCase().includes(fragment.toLowerCase()));
  }

  function ctaFamily(name) {
    return Array.isArray(LIBRARY.ctas?.[name]) ? LIBRARY.ctas[name] : [];
  }

  function hasCTA(name, fragment) {
    return ctaFamily(name).some(item => clean(item).toLowerCase().includes(fragment.toLowerCase()));
  }

  function nicheType(b) {
    const source = `${b.niche} ${b.product}`.toLowerCase();
    if (/caldo|sopa|comida|aliment|padaria|restaurante|bebida|gastronom/.test(source)) return "food";
    if (/skincare|beleza|cosm|maquiagem|sérum|serum|protetor/.test(source)) return "beauty";
    if (/cabelo|capilar|shampoo|máscara/.test(source)) return "hair";
    if (/moda|roupa|vestido|calça|bolsa|sapato|acessório/.test(source)) return "fashion";
    if (/curso|serviço|consultoria|app|aplicativo|plataforma|software/.test(source)) return "service";
    if (/casa|limpeza|organizador|cozinha/.test(source)) return "home";
    return "general";
  }

  function productReference(b) {
    const source = `${b.niche} ${b.product}`.toLowerCase();
    if (/caldo/.test(source)) return "esse caldo";
    if (/sopa/.test(source)) return "essa sopa";
    if (/sérum|serum/.test(source)) return "esse sérum";
    if (/protetor/.test(source)) return "esse protetor";
    if (/máscara/.test(source)) return "essa máscara";
    if (/bolsa/.test(source)) return "essa bolsa";
    if (/calça/.test(source)) return "essa calça";
    if (/vestido/.test(source)) return "esse vestido";
    if (/consultoria/.test(source)) return "essa consultoria";
    if (/curso/.test(source)) return "esse curso";
    if (/app|aplicativo/.test(source)) return "esse aplicativo";
    return "esse produto";
  }


  function ofProduct(reference) {
    return clean(reference, "o produto")
      .replace(/^esse\s+/i, "desse ")
      .replace(/^essa\s+/i, "dessa ")
      .replace(/^este\s+/i, "deste ")
      .replace(/^esta\s+/i, "desta ");
  }

  function audienceLabel(b) {
    const type = nicheType(b);
    if (type === "food" && /caldo/.test(b.product.toLowerCase())) return "fã de caldos";
    if (type === "food") return "quem ama comida gostosa e prática";
    if (type === "beauty") return "quem gosta de skincare prático e resultado visível";
    if (type === "hair") return "quem cuida do cabelo e quer perceber diferença de verdade";
    if (type === "fashion") return "quem gosta de se vestir bem sem abrir mão da praticidade";
    if (type === "service") return "quem quer resolver isso com menos tentativa e erro";
    if (type === "home") return "quem quer uma rotina mais prática e organizada";
    return "quem procura uma solução que funcione de verdade na rotina";
  }

  function inferFormat(b) {
    if (b.format && b.format !== "Deixar o aplicativo escolher") return b.format;
    const type = nicheType(b);
    const objective = b.objective.toLowerCase();
    if (/ensinar/.test(objective)) return findLibraryFormat("tutorial de como usar", "Tutorial de como usar");
    if (/engajamento/.test(objective)) return findLibraryFormat("respostas a comentário", "Resposta a comentário");
    if (type === "food") return findLibraryFormat("sensorial", "Sensorial + review");
    if (type === "beauty" || type === "hair") return findLibraryFormat("vídeo demonstrativo", "Demonstração + experiência");
    if (type === "fashion") return findLibraryFormat("vlog", "Vlog + formas de usar");
    if (type === "service") return findLibraryFormat("benefícios e soluções", "Problema e solução + demonstração de tela");
    return findLibraryFormat("formato 1x1", "Conversa com amiga + problema e solução");
  }

  function inferQuestions(b) {
    const explicit = lines(b.productQuestions);
    if (explicit.length) return explicit;
    const type = nicheType(b);
    if (type === "food") return ["Chega bem apresentado?", "A porção é suficiente?", "A textura e o sabor parecem bons de verdade?"];
    if (type === "beauty") return ["Como fica na pele?", "É fácil de aplicar?", "A textura pesa ou fica pegajosa?"];
    if (type === "hair") return ["Como fica o cabelo depois?", "Pesa nos fios?", "É simples de usar na rotina?"];
    if (type === "fashion") return ["Como veste no corpo?", "O tecido e o acabamento parecem bons?", "Dá para usar em ocasiões diferentes?"];
    if (type === "service") return ["Como funciona na prática?", "Para quem faz sentido?", "Qual problema resolve e como começar?"];

  function inferSensation(b) {
    if (b.sensation) return b.sensation;
    const type = nicheType(b);
    if (type === "food") return "aconchego, vontade de experimentar e sensação de refeição bem feita";
    if (type === "beauty" || type === "hair") return "autocuidado, confiança e satisfação com o resultado";
    if (type === "fashion") return "confiança, estilo e vontade de usar em diferentes momentos";
    if (type === "service") return "alívio, clareza e segurança para agir";

  }

  function inferMotive(b) {
    if (b.purchaseMotive) return b.purchaseMotive;
    const type = nicheType(b);
    if (type === "food") return "resolver uma refeição com praticidade sem abrir mão de sabor";
    if (type === "beauty" || type === "hair") return "obter um resultado percebido sem complicar a rotina";
    if (type === "fashion") return "sentir-se bem vestida com uma peça versátil e fácil de combinar";
    if (type === "service") return "economizar tempo e ter um caminho mais claro para resolver o problema";
    return "resolver uma necessidade real de forma simples";
  }

  function inferObjection(b) {
    if (b.objection) return b.objection;
    const type = nicheType(b);
    if (type === "food") return "medo de o produto chegar sem graça, pequeno ou diferente do que aparece na divulgação";
    if (type === "beauty" || type === "hair") return "medo de comprar e não perceber diferença ou não gostar da textura";
    if (type === "fashion") return "dúvida sobre caimento, qualidade e versatilidade";
    if (type === "service") return "dúvida sobre utilidade real, facilidade de uso e retorno do investimento";

  }

  function inferProof(b) {
    if (b.proofAvailable) return b.proofAvailable;
    const type = nicheType(b);
    if (type === "food") return "mostrar embalagem, porção, vapor ou textura, colherada e reação ao experimentar";
    if (type === "beauty") return "mostrar textura, aplicação, absorção e acabamento em luz natural";
    if (type === "hair") return "mostrar aplicação, desembaraço, movimento e resultado final dos fios";
    if (type === "fashion") return "mostrar frente, costas, detalhe do tecido, caimento e pelo menos duas formas de usar";
    if (type === "service") return "mostrar tela, processo, antes e depois do fluxo ou exemplo real de uso";
    return "mostrar o produto em uso e o detalhe que comprova o benefício";
  }

  function normalizeBriefing(input) {
    const b = { ...input };
    b.brand = clean(b.brand, "a marca");
    b.product = clean(b.product, "o produto");
    b.niche = clean(b.niche, b.product);
    b.objective = clean(b.objective, "Apresentar o produto");
    b.distribution = clean(b.distribution, "Orgânico");
    b.platform = clean(b.platform, "Instagram Reels");
    b.durationSeconds = Math.min(Math.max(Number(b.durationSeconds) || 45, 15), 60);
    b.targetAudience = clean(b.targetAudience, "pessoas que enfrentam o problema descrito");
    b.mainPain = clean(b.mainPain, "uma dificuldade real da rotina");
    b.mainDesire = clean(b.mainDesire, `resolver ${lowerFirst(b.mainPain)} de forma mais simples`);
    b.differentiator = clean(b.differentiator, "um benefício claro no uso real");
    b.receivedBriefing = clean(b.receivedBriefing);
    b.restrictions = clean(b.restrictions);
    b.offerDetails = clean(b.offerDetails);
    b.brandLinks = lines(b.brandLinks);
    b.brandVisualNotes = clean(b.brandVisualNotes);
    b.brandAssetNames = Array.isArray(b.brandAssetNames) ? b.brandAssetNames : [];
    b.brandPalette = Array.isArray(b.brandPalette) ? b.brandPalette : [];
    b.hookPreference = clean(b.hookPreference, "Escolher automaticamente");
    b.includeBRoll = clean(b.includeBRoll, "Automático");
    b.ctaType = clean(b.ctaType, "Escolher automaticamente");
    b.format = inferFormat(b);
    b.productQuestions = inferQuestions(b);
    b.sensation = inferSensation(b);
    b.purchaseMotive = inferMotive(b);
    b.objection = inferObjection(b);
    b.proofAvailable = inferProof(b);
    b.authorityProof = clean(b.authorityProof, "experiência pessoal e demonstração real");
    b.productRef = productReference(b);
    b.audienceLabel = audienceLabel(b);
    b.type = nicheType(b);
    return b;
  }

  function visualOpening(type, b, variant = 0) {
    const product = b.productRef;
    const maps = {

        ["Comece com um comentário na tela e aponte para ele antes de mostrar o produto.", "eu também queria saber isso", "Caixinha de comentário"]
      ]
    };
    const set = maps[type] || maps.general;
    const [action, screen, family] = set[variant % set.length];
    return { action, screen, product, family };
  }

  function auditoryLine(b, variant) {
    const benefit = lowerFirst(words(b.differentiator, 10));
    const familyByVariant = [
      "Ganchos De Curiosidade",
      "Ganchos Que Não Parecem Vendas",
      "Ganchos De Solução x Benefício"
    ];
    const family = familyByVariant[variant % familyByVariant.length];
    const pool = [
      hasAudioPattern(family, "Você precisa de") || hasAudioPattern(family, "Você é")
        ? `Se você é ${b.audienceLabel}, eu preciso te mostrar ${b.productRef} antes da sua próxima escolha.`
        : `Eu preciso te mostrar ${b.productRef} antes da sua próxima escolha.`,
      hasAudioPattern(family, "não tinha grandes expectativas") || hasAudioPattern(family, "me surpreendeu")
        ? `Eu achei que ${b.productRef} seria só mais um teste, mas ${benefit} me surpreendeu.`
        : `Eu testei ${b.productRef} sem grandes expectativas, mas me surpreendi.`,
      hasAudioPattern(family, "solução") || hasAudioPattern(family, "facilitou")
        ? `Eu queria que alguém tivesse me mostrado isso antes — eu teria evitado muita tentativa e erro.`
        : `Eu encontrei uma forma mais simples de resolver isso na minha rotina.`
    ];
    return { line: pool[variant % pool.length], family };
  }

  function hookTypes(b) {
    if (b.hookPreference === "Textual") return ["Textual", "Textual", "Textual"];
    if (b.hookPreference === "Visual") return ["Visual", "Visual", "Visual"];
    if (b.hookPreference === "Auditivo") return ["Auditivo", "Auditivo", "Auditivo"];
    return ["Textual", "Visual", "Auditivo"];
  }

  function hookScene(hook, seconds = "0–5s") {
    return {
      number: 1,
      element: "Gancho",
      seconds,
      spokenLine: hook.spokenLine || "",
      screenText: hook.onScreenText || "",
      recordSteps: hook.recordSteps || [],
      bRoll: hook.bRoll || "Não precisa de B-roll nesta abertura.",
      cutAfter: hook.cutAfter || "Corte assim que terminar a frase ou concluir a ação visual."
    };
  }

  function createHooks(b) {
    const types = hookTypes(b);
    const created = types.map((type, index) => {
      const visual = visualOpening(b.type, b, index);
      const auditory = auditoryLine(b, index);
      const spoken = auditory.line;
      if (type === "Visual") {
        return {
          type,
          text: visual.screen,
          spokenLine: index === 1 ? `Eu vi esse detalhe e precisei testar ${b.productRef}.` : `Eu quero te mostrar por que esse detalhe fez diferença pra mim.`,
          onScreenText: visual.screen,
          recordSteps: [
            "Deixe o celular na vertical e já comece gravando.",
            visual.action,
            "Espere a ação visual terminar e só então diga a frase."
          ],
          bRoll: "A própria abertura já funciona como imagem de apoio; não grave B-roll separado.",
          cutAfter: "Corte no fim da ação e passe direto para o problema.",
          sourceFamily: visual.family || "Gancho visual"
        };
      }
      if (type === "Auditivo") {
        return {
          type,
          text: spoken,
          spokenLine: spoken,
          onScreenText: words(spoken.replace(/^Eu\s+/i, ""), 7),
          recordSteps: [
            "Enquadre do peito para cima, com o produto visível ao lado do rosto.",
            "Olhe para a lente e diga a frase sem cumprimentar ou apresentar a marca.",
            "Faça uma pausa curta antes da parte mais importante da frase."
          ],
          bRoll: "Opcional: após a frase, corte para um detalhe do produto por um segundo.",
          cutAfter: "Corte imediatamente depois da palavra que entrega a surpresa.",
          sourceFamily: auditory.family || "Gancho auditivo"
        };
      }
      return {
        type,
        text: spoken,
        spokenLine: spoken,
        onScreenText: index === 0 ? `se você é ${b.audienceLabel}, olha isso` : words(spoken, 7),
        recordSteps: [
          "Posicione o celular na vertical, na altura dos olhos, mostrando você do peito para cima.",
          `Segure ${b.productRef} na altura do ombro, sem cobrir seu rosto ou o rótulo.`,
          "Comece falando direto. Não diga “oi”, “gente” ou o nome da marca antes do gancho."
        ],
        bRoll: "Não precisa de B-roll durante a primeira frase.",
        cutAfter: "Corte assim que terminar a frase e entre na situação-problema.",
        sourceFamily: auditory.family || "Gancho textual/auditivo"
      };
    });
    if (b.includeBRoll === "Não usar") {
      created.forEach(hook => { hook.bRoll = "Não grave B-roll nesta cena."; });
    }
    return created;
  }

  function scenePlan(b, hooks) {
    const hook = hooks[0];
    const scenes = [hookScene(hook)];
    const pain = lowerFirst(words(b.mainPain, 15));
    const benefit = lowerFirst(words(b.differentiator, 14));
    const question = b.productQuestions[0] || "se funciona na prática";
    const motive = lowerFirst(words(b.purchaseMotive, 12));

    scenes.push({
      number: 2, element: "Problema", seconds: "5–11s",
      spokenLine: `O meu problema era ${pain}.`,
      screenText: "o problema que eu tinha",
      recordSteps: practicalProblemSteps(b),
      bRoll: bRollFor(b, "problem"),
      cutAfter: "Termine a frase olhando para o problema e corte no movimento para o produto."
    });

    scenes.push({
      number: 3, element: "Descoberta", seconds: "11–19s",
      spokenLine: `Foi aí que eu testei ${b.productRef}, da ${b.brand}, e o primeiro detalhe que me chamou atenção foi ${benefit}.`,
      screenText: "o primeiro diferencial",
      recordSteps: practicalDiscoverySteps(b),
      bRoll: bRollFor(b, "discovery"),
      cutAfter: "Corte quando o diferencial estiver claramente visível."
    });

    scenes.push({
      number: 4, element: "Demonstração", seconds: "19–29s",
      spokenLine: `Eu queria saber: ${lowerFirst(question).replace(/\?$/, "")}? Então eu mostrei na prática.`,
      screenText: "testando de verdade",
      recordSteps: practicalDemoSteps(b),
      bRoll: bRollFor(b, "demo"),
      cutAfter: "Finalize no momento em que o resultado estiver mais fácil de enxergar."
    });

    scenes.push({
      number: 5, element: "Resultado", seconds: "29–38s",
      spokenLine: `Pra mim, o melhor foi conseguir ${motive} e sentir ${lowerFirst(words(b.sensation, 8))}.`,
      screenText: "o que eu percebi",
      recordSteps: practicalResultSteps(b),
      bRoll: bRollFor(b, "result"),
      cutAfter: "Segure a reação por um segundo antes do último corte."
    });

    scenes.push({
      number: 6, element: "CTA", seconds: "38–45s",
      spokenLine: buildCTA(b),
      screenText: ctaScreen(b),
      recordSteps: [
        `Volte para o enquadramento do peito para cima e mantenha ${b.productRef} visível.`,
        "Olhe para a lente e diga a CTA em uma única frase.",
        "Aponte apenas uma vez para o local do link ou comentário; não repita o gesto."
      ],
      bRoll: "Opcional: use a tela do site ou o produto parado por um segundo após a fala.",
      cutAfter: "Deixe o texto da CTA na tela por mais um segundo e encerre."
    });

    if (b.includeBRoll === "Não usar") {
      scenes.forEach(scene => { scene.bRoll = "Não grave B-roll nesta cena."; });
    }

    if (b.durationSeconds <= 30) {
      const compact = [scenes[0], scenes[1], scenes[3], scenes[5]];
      compact.forEach((s, i) => { s.number = i + 1; });
      compact[0].seconds = "0–4s"; compact[1].seconds = "4–10s"; compact[2].seconds = "10–23s"; compact[3].seconds = "23–30s";
      return compact;
    }
    if (b.durationSeconds >= 60) {
      scenes.splice(5, 0, {
        number: 6, element: "Confiança", seconds: "38–50s",
        spokenLine: `Eu também prestei atenção em ${lowerFirst(words(b.objection, 12))}; por isso mostrei tudo de perto antes de recomendar.`,
        screenText: "sem esconder os detalhes",
        recordSteps: [
          "Mostre uma avaliação verdadeira, comentário autorizado ou detalhe do produto que responda à objeção.",
          "Faça um zoom lento no ponto que comprova a informação.",
          "Mantenha sua voz em off enquanto a evidência aparece."
        ],
        bRoll: "Use somente prova verdadeira e autorizada pela marca.",
        cutAfter: "Corte depois que a evidência ficar legível por pelo menos dois segundos."
      });
      scenes[6].number = 7; scenes[6].seconds = "50–60s";
    }
    return scenes;
  }

  function practicalProblemSteps(b) {
    if (b.type === "food") return ["Grave uma cena de dois segundos chegando à mesa ou abrindo a geladeira com expressão cansada.", "Corte para você sentada, olhando para a câmera.", "Diga a frase enquanto mostra que não quer cozinhar ou escolher qualquer refeição."];

  function practicalResultSteps(b) {
    if (b.type === "food") return ["Volte para um plano do peito para cima com a comida em primeiro plano.", "Dê uma segunda colherada ou mostre a porção depois de provar.", "Diga a frase com a reação que você realmente teve."];

    if (b.type === "fashion") return ["Caminhe dois passos em direção à câmera usando o look completo.", "Mostre uma segunda forma de usar ou um detalhe funcional.", "Diga a frase em voz off."];

  function bRollFor(b, purpose) {
    if (b.includeBRoll === "Não usar") return "Não grave B-roll nesta cena.";
    const optional = b.includeBRoll === "Automático" ? "Opcional: " : "";
    const map = {
      problem: "um take de dois segundos da situação-problema",
      discovery: "close do produto, embalagem ou detalhe principal",
      demo: "detalhe do uso, textura, movimento ou tela",

  function ctaCategory(b) {
    if (/paga/i.test(b.distribution)) return "ads";
    return "organic";
  }

  function buildCTA(b) {
    const paid = /paga/i.test(b.distribution);
    const hasOffer = Boolean(b.offerDetails);
    if (b.ctaType === "Comentar para receber o link") {
      return hasCTA("CTA Orgânico**", "comenta aqui embaixo")
        ? "Comenta “eu quero” aqui embaixo que eu te envio o link."
        : "Deixa um comentário que eu te envio o link.";
    }
    if (b.ctaType === "Salvar e compartilhar") {
      return hasCTA("CTA Orgânico**", "salva esse vídeo")

        : "Salva e compartilha com alguém que vai gostar.";
    }
    if (b.ctaType === "Comprar") {
      return paid
        ? `Clica no botão para conferir ${ofProduct(b.productRef)}${hasOffer ? ` e aproveitar ${b.offerDetails}` : ""}.`
        : `Se você também ficou com vontade de testar, eu deixei o link ${ofProduct(b.productRef)} para você conferir.`;
    }
    if (b.ctaType === "Clicar no link") return `Eu deixei o link ${ofProduct(b.productRef)} para você ver todos os detalhes.`;
    if (/engajamento/i.test(b.objective)) return "Me conta nos comentários se você também usaria e salva para lembrar depois.";
    if (paid) {
      return hasCTA("CTA Ads**", "é muito fácil fazer o pedido")
        ? `É muito fácil conferir: clica no botão e veja todos os detalhes ${ofProduct(b.productRef)}${hasOffer ? ` — ${b.offerDetails}` : ""}.`
        : `Clica no botão e confere todos os detalhes ${ofProduct(b.productRef)}${hasOffer ? ` — ${b.offerDetails}` : ""}.`;

  function auditFirstPerson(scenes) {

  function durationAnalysis(scenes, requested) {

    ];

    ];

    ];
    return [

      `Depois do uso, senti ${sensation}. Para mim, o principal benefício foi ${motive}.`,

  function readyScreenTexts(b, result) {
    const first = clean(result?.scenes?.[0]?.screenText, words(result?.scenes?.[0]?.spokenLine || "presta atenção nisso", 6));
    const maps = {
      food: [first, "perfeito para uma refeição aconchegante", "opções e detalhes do produto", "olha essa textura", "praticidade sem abrir mão do sabor", "mostrando tudo de perto", "escolha o seu favorito"],

  function readyTitles(type) {
    return type === "food"
      ? ["Gancho", "Contexto", "Apresentação", "Experiência sensorial", "Prova e resultado", "Quebra de objeção", "CTA"]
      : ["Gancho", "Contexto", "Apresentação", "Demonstração", "Prova e resultado", "Quebra de objeção", "CTA"];
  }

  function readyCaption(b, result) {
    const format = clean(result?.recommendedFormat || b.format, "UGC");

    const niche = b.type === "food" ? "Alimentação e negócios locais"
      : b.type === "beauty" ? "Beleza e skincare"
      : b.type === "hair" ? "Beleza e cuidados capilares"
      : b.type === "fashion" ? "Moda e acessórios"
      : b.type === "service" ? "Serviços e soluções digitais"
      : "Produtos e estilo de vida";
    const tone = b.type === "food" ? "próxima, apetitosa e natural"
      : b.type === "beauty" ? "próxima, demonstrativa e natural"
      : b.type === "hair" ? "próxima, visual e natural"
      : b.type === "fashion" ? "prática, visual e natural"
      : "prática, próxima e natural";

      `🎥 Vídeo UGC ${format.toLowerCase()} apresentando ${b.product} de forma ${tone}.`,
      "",

      "",
      `📌 Nicho: ${niche}.`,
      "",
      clean(result?.primaryCTA || buildCTA(b))
    ].join("\n");
  }

  function buildReadyScript(input, result) {
    const b = normalizeBriefing(input || {});
    const speech = readyLines(b, result || {});
    const directions = readyDirections(b.type, b.productRef, b.brand);
    const directionList = [directions.hook, directions.context, directions.presentation, directions.experience, directions.result, directions.objection, directions.cta];
    const screens = readyScreenTexts(b, result || {});
    const titles = readyTitles(b.type);
    const ranges = ["0–5s", "5–13s", "13–22s", "22–34s", "34–44s", "44–52s", "52–60s"];
    const scenes = speech.map((spokenLine, index) => ({
      number: index + 1,
      title: titles[index],
      seconds: ranges[index],
      direction: directionList[index],
      spokenLine: clean(spokenLine),
      screenText: screens[index]
    }));
    const wordCount = speech.join(" ").split(/\s+/).filter(Boolean).length;
    const estimatedSeconds = Math.round(wordCount / 2.6);
    const cover = result?.coverIdeas?.[0] || { title: result?.coverTitle || "O detalhe que me surpreendeu", photo: "Produto em primeiro plano e você reagindo ao fundo." };
    return {
      version: "4.1",
      title: `ROTEIRO UGC — ${b.brand.toUpperCase()} · ${b.product.toUpperCase()}`,
      format: clean(result?.recommendedFormat || b.format, "UGC"),
      durationLabel: "50 a 60 segundos",
      estimatedSeconds,
      wordCount,
      scenes,
      continuousSpeech: speech.join(" "),
      screenTexts: scenes.map(scene => ({ scene: scene.number, text: scene.screenText })),
      caption: readyCaption(b, result || {}),
      cover: { title: cover.title, photo: cover.photo },
      selectedHookIndex: Number(result?.selectedHookIndex || 0)
    };
  }

  function applyHook(result, hookIndex) {
    const index = Math.min(Math.max(Number(hookIndex) || 0, 0), result.hooks.length - 1);
    const hook = result.hooks[index];
    result.selectedHookIndex = index;
    result.selectedHook = hook.text;
    result.scenes[0] = hookScene(hook, result.scenes[0]?.seconds || "0–5s");
    return result;
  }

  function generate(input) {
    const b = normalizeBriefing(input);
    const hooks = createHooks(b);
    const scenes = scenePlan(b, hooks);
    const cap = captions(b);
    const style = styling(b);
    const answer = {
      version: "4.0",
      strategySummary: "Roteiro UGC processado internamente com gancho, problema, solução, demonstração, resultado e CTA. A interface exibe somente instruções prontas para gravação.",
      primaryObjective: b.objective,
      recommendedFormat: b.format,
      targetAudience: b.targetAudience,
      hooks,
      selectedHookIndex: 0,
      selectedHook: hooks[0].text,
      scenes,
      primaryCTA: buildCTA(b),
      organicCTA: /paga/i.test(b.distribution) ? `Se você quiser ver mais detalhes, eu deixei o link ${ofProduct(b.productRef)} para conferir.` : buildCTA(b),
      paidCTA: `Clica no botão e confere todos os detalhes ${ofProduct(b.productRef)}${b.offerDetails ? ` — ${b.offerDetails}` : ""}.`,
      caption: cap.recommended,
      captions: cap,
      coverIdeas: coverIdeas(b),
      coverTitle: coverIdeas(b)[0].title,
      stylingIdeas: style,
      mandatoryAnswers: {
        differentials: b.differentiator,
        possibleQuestions: b.productQuestions,
        sensation: b.sensation,
        purchaseMotive: b.purchaseMotive,
        targetAudience: b.targetAudience,
        objection: b.objection,
        proof: b.proofAvailable
      },
      brandReading: {
        visualIdentitySummary: b.brandVisualNotes || "Sem descrição visual adicionada; usar cenário simples e coerente com o produto.",
        palette: b.brandPalette,
        references: [...b.brandLinks, ...b.brandAssetNames],
        limitation: b.brandLinks.length ? "Na versão local, os links são registrados como referência, mas não são navegados automaticamente." : ""
      },
      durationAnalysis: durationAnalysis(scenes, b.durationSeconds),
      firstPersonAudit: auditFirstPerson(scenes),
      internalLibrary: {
        audioHooks: LIBRARY.sourceSummary?.audioHookCount || 0,
        visualFamilies: LIBRARY.sourceSummary?.visualCategoryCount || 0,
        ctas: LIBRARY.sourceSummary?.ctaCount || 0,
        formats: LIBRARY.sourceSummary?.formatCount || 0,
        hookFamiliesUsed: hooks.map(hook => hook.sourceFamily),
        formatSource: b.format,
        ctaSource: /paga/i.test(b.distribution) ? "CTA Ads / CTA Ambos" : "CTA Orgânico / CTA Ambos"
      },
      confidenceLabel: "Roteiro prático para teste e adaptação ao briefing real da marca."
    };
    return answer;
  }

  return {
    generate,
    applyHook,
    normalizeBriefing,
    createHookCandidates: createHooks,
    firstPersonAudit: auditFirstPerson,
    durationAnalysis,
    buildReadyScript,
    version: "4.1"
  };
});

  function priorityScore(task) {
    let score = clamp(task.consequence) * 10;
    score += clamp(task.revenueImpact) * 6;
    score += clamp(task.strategicImpact) * 5;
    score += task.blocksOthers ? 12 : 0;
    if (task.dueDate) {
      const start = parseDate(toISODate(new Date()));
      const due = parseDate(task.dueDate);
      const days = Math.round((due - start) / 86400000);
      if (days < 0) score += 35;
      else if (days === 0) score += 30;
      else if (days === 1) score += 24;
      else if (days <= 3) score += 16;
      else if (days <= 7) score += 8;
    }
    if (Number(task.estimatedMinutes) <= 15) score += 3;
    if (Number(task.estimatedMinutes) > 180) score -= 4;
    return score;
  }

  function daysUntil(date) {
    if (!date) return null;
    return Math.round((parseDate(date) - parseDate(toISODate(new Date()))) / 86400000);
  }

  function dueLabel(date) {
    const days = daysUntil(date);
    if (days === null) return "Sem prazo";
    if (days < 0) return `${Math.abs(days)}d atrasada`;
    if (days === 0) return "Hoje";
    if (days === 1) return "Amanhã";
    return formatDate(date);
  }

  async function analyzeBrandFiles(files) {
    if (!files.length) return { names: [], palette: [], previews: [] };
    const names = files.map(file => file.name);
    const previews = [];
    const colors = [];
    for (const file of files) {
      try {
        const dataUrl = await readFileAsDataURL(file);
        previews.push({ name: file.name, dataUrl });
        const palette = await extractPalette(dataUrl);
        colors.push(...palette);
      } catch { /* arquivo ignorado */ }
    }
    return { names, previews, palette: uniqueColors(colors).slice(0, 6) };
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function extractPalette(dataUrl) {
    return new Promise(resolve => {
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        const size = 80;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(image, 0, 0, size, size);
        const pixels = ctx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        for (let i = 0; i < pixels.length; i += 20) {
          const alpha = pixels[i + 3];
          if (alpha < 180) continue;
          let r = Math.round(pixels[i] / 32) * 32;
          let g = Math.round(pixels[i + 1] / 32) * 32;
          let b = Math.round(pixels[i + 2] / 32) * 32;
          if (r > 240 && g > 240 && b > 240) continue;
          if (r < 20 && g < 20 && b < 20) continue;
          r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
          const key = `${r},${g},${b}`;
          buckets.set(key, (buckets.get(key) || 0) + 1);
        }
        const palette = [...buckets.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([rgb]) => {
          const [r, g, b] = rgb.split(",").map(Number);
          return `#${[r, g, b].map(value => value.toString(16).padStart(2, "0")).join("").toUpperCase()}`;
        });
        resolve(palette);
      };
      image.onerror = () => resolve([]);
      image.src = dataUrl;
    });
  }

  function uniqueColors(colors) {
    const unique = [];
    for (const color of colors) if (color && !unique.includes(color)) unique.push(color);
    return unique;
  }

          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ briefing })
        });
        const payload = await result.json().catch(() => ({}));
        if (!result.ok) throw new Error(payload.error || "O backend não respondeu corretamente.");
        response = payload.version === "4.0" ? payload : window.UGCEngine.generate(briefing);
      } else {
        await new Promise(resolve => setTimeout(resolve, 550));

      const script = { id: uid(), briefing, response, selectedHookIndex: 0, createdAt: new Date().toISOString() };

  function normalizeHook(hook) {
    return {
      type: hook?.type || "Textual",
      text: hook?.text || hook?.spokenLine || "",
      spokenLine: hook?.spokenLine || "",
      onScreenText: hook?.onScreenText || "",
      recordSteps: Array.isArray(hook?.recordSteps) ? hook.recordSteps : [],
      bRoll: hook?.bRoll || "",
      cutAfter: hook?.cutAfter || ""
    };

  function renderSteps(steps) {

  function renderScript(script) {
    const root = $("#scriptPreview");
    if (!root || !script?.response) return;
    const r = script.response;
    const hooks = (r.hooks || []).map(normalizeHook);
    const selectedIndex = Number.isInteger(script.selectedHookIndex) ? script.selectedHookIndex : Number(r.selectedHookIndex || 0);
